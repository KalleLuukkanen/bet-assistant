services:
  client:
    build: client
    restart: unless-stopped
    volumes:
      - ./client/src:/app/src
    ports:
      - 5173:5173
    depends_on:
      - server

  server:
    build: server
    restart: unless-stopped
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./project.env:/app/.env
    ports:
      - 8000:8000
    depends_on:
      database-migrations:
        condition: service_completed_successfully

  database:
    container_name: bet-assistant_database
    image: postgres:17.5
    restart: unless-stopped
    env_file:
      - project.env

  # one-off job, not started by `docker compose up`. Run with:
  #   docker compose run --rm nba-ingest
  #   docker compose run --rm nba-ingest python -m collectors.nba_collector --seasons 2026-27
  nba-ingest:
    build: python-service
    profiles: ["ingest"]
    env_file:
      - project.env
    volumes:
      - ./python-service:/app
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    command: python -m collectors.nba_collector

  # daily sync of the current season (runs with `docker compose up`)
  nba-sync:
    build: python-service
    restart: unless-stopped
    env_file:
      - project.env
    environment:
      PYTHONUNBUFFERED: "1"  # print logs immediately
      # NBA_SYNC_HOUR_UTC: "18"
    volumes:
      - ./python-service:/app
    depends_on:
      database-migrations:
        condition: service_completed_successfully
    command: python -m collectors.scheduler

  database-migrations:
    image: flyway/flyway:11.10
    env_file:
      - project.env
    depends_on:
      - database
    volumes:
      - ./database-migrations:/flyway/db/migration
    command: -connectRetries=60 -baselineOnMigrate=true migrate
